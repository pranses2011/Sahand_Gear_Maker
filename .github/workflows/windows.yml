name: windows-build-screenshots

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# مجوز لازم برای کامیت خودکار اسکرین‌شات‌ها به مخزن (بدون این، پوش bot خطای 403 می‌گیرد)
permissions:
  contents: write

jobs:
  windows:
    name: Build, Test & Screenshots (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore solution
        run: dotnet restore SahandGearMaker.sln

      - name: Build full solution (incl. WPF app)
        run: dotnet build SahandGearMaker.sln --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test tests/SahandGearMaker.Tests --configuration Release --no-build --logger "console;verbosity=normal"

      - name: Publish WPF app (framework-dependent)
        run: >
          dotnet publish src/SahandGearMaker.App/SahandGearMaker.App.csproj
          -c Release -o publish/app
          --framework net8.0-windows
          -p:SelfContained=false
          -p:PublishSingleFile=false

      - name: Publish CLI
        run: >
          dotnet publish src/sgm-cli/sgm-cli.csproj
          -c Release -o publish/cli
          -p:SelfContained=false

      - name: Generate real screenshots (engine renders + real UI capture)
        run: |
          # ۱) رندرهای موتور (خانواده‌ها + صحنه‌ها) — بدون نیاز به UI
          dotnet run --project src/SahandGearMaker.Screenshots --configuration Release --no-build -- screenshots
          # ۲) کپچر رابط کاربری توسط خود برنامهٔ واقعی — اسمبلی ورودی درست، بدون خطای BAML بین‌اسمبلی
          publish/app/SahandGearDesigner.exe --screenshot screenshots
          Get-ChildItem screenshots/*.png | Select-Object Name, Length

      - name: Upload screenshots artifact
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/
          if-no-files-found: error

      - name: Upload Windows app artifact
        uses: actions/upload-artifact@v4
        with:
          name: sahand-gear-maker-windows
          path: publish/
          if-no-files-found: error

      - name: Upload test results summary
        if: always()
        run: echo "Windows build, tests, publish and screenshots completed."

      # فاز ۱/۵: بازگرداندن اسکرین‌شات‌های واقعی به مخزن — README همیشه به‌روز بماند
      - name: Commit screenshots back to repo
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout main
          git pull origin main
          $changed = $false
          Get-ChildItem screenshots/*.png | ForEach-Object {
            $target = "docs/screenshots/$($_.Name)"
            if (-not (Test-Path $target) -or (Get-FileHash $_.FullName).Hash -ne (Get-FileHash $target).Hash) {
              Copy-Item $_.FullName $target -Force
              $changed = $true
            }
          }
          if ($changed) {
            git add docs/screenshots
            git commit -m "docs: اسکرین‌شات‌های واقعی برنامه — به‌روزرسانی خودکار از CI ویندوزی [skip ci]"
            git push origin main
          } else {
            Write-Host "No screenshot changes."
          }
